<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<!-- Dev-phase cache hints: avoid stale JS/HTML on GitHub Pages during active iteration -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="theme-color" content="#0b0f1a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Infinity Slayer</title>
<!-- break_infinity.js: fast large-number math for incremental games -->
<script src="https://cdn.jsdelivr.net/npm/break_infinity.js@2"></script>
<link rel="stylesheet" href="styles.css" />
<!-- Combat economy module: must load before game.js (the UI layer) -->
<script src="combat.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">⚔</span>
        <span class="title">Infinity Slayer</span>
      </div>
      <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
    </header>

    <!-- ===== Battle stage (upper screen) ===== -->
    <section class="stage" id="stage">
      <div class="stage-head">
        <span class="stage-name" id="stageName">Green Meadows</span>
        <span class="stage-kills" id="stageKills">0 / 40</span>
      </div>

      <div class="arena" id="arena">
        <!-- Hero on the left, enemy on the right -->
        <div class="hero" id="hero" aria-label="Hero">
          <div class="hero-sprite" id="heroSprite"></div>
        </div>

        <div class="combat-space">
          <div class="dps-readout"><b id="dpsValue">1</b> DPS</div>
          <div class="floaters" id="floaters"></div>
        </div>

        <div class="enemy" id="enemy" aria-label="Enemy">
          <div class="enemy-sprite" id="enemySprite"></div>
          <div class="enemy-name" id="enemyName">Slime</div>
          <div class="hp-bar">
            <div class="hp-fill" id="hpFill"></div>
            <span class="hp-text" id="hpText">4 / 4</span>
          </div>
        </div>
      </div>

      <!-- Boss attempt control -->
      <div class="boss-strip">
        <button id="bossBtn" class="boss-btn hidden">⚔ Attempt Boss</button>
        <div class="boss-hint" id="bossHint"></div>
      </div>
    </section>

    <!-- ===== Gold + upgrades (lower screen) ===== -->
    <section class="gold-bar">
      <span class="gold-icon">🪙</span>
      <span class="gold-value" id="goldValue">0</span>
      <span class="gold-label">gold</span>
    </section>

    <main class="panel">
      <div id="upgradeList" class="upgrade-list"></div>
    </main>
  </div>

  <!-- Menu / settings sheet -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-card">
      <h2>Menu</h2>
      <p class="muted" id="offlineNote"></p>
      <div class="sheet-actions">
        <button id="saveBtn" class="btn">Save</button>
        <button id="exportBtn" class="btn">Export save</button>
        <button id="importBtn" class="btn">Import save</button>
        <button id="hardResetBtn" class="btn danger">Hard reset</button>
        <button id="closeSheet" class="btn ghost">Close</button>
      </div>
      <p class="muted small">Prototype build. Autosaves every 15s and on exit.</p>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="game.js"></script>
</body>
</html>
