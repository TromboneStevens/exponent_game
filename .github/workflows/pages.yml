name: Deploy to GitHub Pages

# Publishes the static game to GitHub Pages on every push to main, so the
# latest changes are playable on the web with no build step or manual deploy.
on:
  push:
    branches: [main]
  # Allow manually re-running the deploy from the Actions tab.
  workflow_dispatch:

# Permissions the deploy job needs to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        # Copy only the files the browser game needs into _site/, leaving the
        # Node simulator (sim/) and dev files out of the published artifact.
        # combat.js is the module the combat UI loads; economy.js is kept too
        # (unused by the UI for now, harmless, slated for a later prestige layer).
        run: |
          mkdir -p _site
          cp index.html styles.css combat.js economy.js game.js _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
